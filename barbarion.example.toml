domain = "default"
data_dir = "./data"
output_dir = "./output"
logs_dir = "./logs"
database_path = "./data/barbarion.db"
log_level = "INFO"
ollama_url = "http://127.0.0.1:11434"
ollama_timeout_seconds = 2.0

[ingestion]
paths = ["./sources"]
extensions = [
  ".sql", ".pks", ".pkb", ".prc", ".fnc", ".trg",
  ".pck", ".vw", ".vws", ".pkg", ".tps",
  ".srw", ".sru", ".srf", ".srm", ".srj", ".srd", ".pbl",
  ".md", ".txt", ".docx", ".pdf",
  ".yaml", ".yml", ".json", ".ini"
]
chunk_size = 4000
chunk_overlap = 400
ignore_patterns = [
  ".git/**", ".barbarion/**", ".venv/**",
  "**/__pycache__/**", "data/**", "output/**", "logs/**",
  "**/node_modules/**"
]
max_file_size_mb = 50
max_extracted_chars = 5000000
max_pdf_pages = 1000
encodings = ["utf-8", "cp1252", "latin-1"]

[embeddings]
provider = "ollama"
model = "nomic-embed-text"
batch_size = 16
timeout_seconds = 60.0
normalize = true

[vector_store]
provider = "sqlite_vec"
table_prefix = "rag"
distance = "cosine"

[retrieval]
mode = "hybrid"
top_k = 10
candidate_k = 40
similarity_threshold = 0.20
vector_weight = 0.70
keyword_weight = 0.30

[rag]
# Contrato legado activo en baseline_v1. No declarar junto con
# input_token_budget_est; el presupuesto del input completo se define tras medir.
context_token_budget = 6000
# input_token_budget_est = <definir a partir de una baseline reproducible>
# chars4_v1 solo estima este presupuesto; no reemplaza el uso real del proveedor.
# Valores: baseline_v1, optimized_v1. optimized_v1 requiere reemplazar
# context_token_budget por input_token_budget_est.
context_selection_policy = "baseline_v1"
max_chunk_tokens = 1200
dedupe_min_hash_prefix = 16
include_snippets = true

[llm]
# Backend generativo predeterminado y local. Valores admitidos: ollama, anthropic.
provider = "ollama"
model = "llama3.1:8b"
timeout_seconds = 600.0
temperature = 0.1
# Desactiva el razonamiento interno en modelos compatibles para reducir latencia.
think = false
# Ventana de contexto que Ollama asigna al modelo durante la generacion.
num_ctx = 16384

# Para usar Anthropic, sustituye el bloque [llm] anterior por este contenido;
# no combines max_output_tokens con Ollama ni think/num_ctx con Anthropic:
#
# [llm]
# provider = "anthropic"
# model = "modelo-claude-autorizado"
# timeout_seconds = 120.0
# temperature = 0.1
# max_output_tokens = 4096
#
# ANTHROPIC_API_KEY se lee exclusivamente desde el entorno al generar. Nunca la
# escribas en este archivo. El endpoint y anthropic-version son fijos en H1.2.

[data_driven]
enabled = false
file_patterns = ["config/**/*.sql"]
max_statements_per_file = 10000
max_literal_chars = 200000
token_patterns = [
  '\{([A-Za-z_][A-Za-z0-9_]*)\}',
  '\$\{([^}]+)\}',
  ':([A-Za-z_][A-Za-z0-9_]*)'
]

[[data_driven.configurations]]
name = "pricing_rules"
symbol_type = "configuration_record"
tables = ["APP_CFG.PRICING_RULES"]
identity_columns = ["RULE_ID"]
file_patterns = ["config/pricing/**/*.sql"]
default_column_order = ["RULE_ID", "RULE_NAME", "DESCRIPTION", "FORMULA"]
name_columns = ["RULE_NAME"]
description_columns = ["DESCRIPTION"]
rule_columns = ["RULE_SQL"]
formula_columns = ["FORMULA"]
variable_columns = ["VARIABLE_NAME"]
parameter_columns = ["PARAMETER_NAME"]
mapping_columns = ["MAPPING_NAME"]
reference_columns = [
  { column = "FUNCTION_NAME", target_technology = "oracle", target_type = "function" },
  { column = "NEXT_STEP_ID", target_configuration = "pricing_rules", relation_type = "precedes" }
]
parent_columns = [
  { column = "PARENT_RULE_ID", target_configuration = "pricing_rules" }
]
sequence_columns = ["DISPLAY_ORDER"]
status_columns = [
  { column = "STATUS", active_values = ["A"], inactive_values = ["I"] }
]
effective_from_columns = ["VALID_FROM"]
effective_to_columns = ["VALID_TO"]
metadata_columns = ["CREATED_BY", "UPDATED_AT"]
