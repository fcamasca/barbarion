[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "barbarion"
dynamic = ["version"]
description = "Agente AI on-premise para sistemas legacy Oracle/PL/SQL y PowerBuilder"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Frankz Camasca" },
]
dependencies = [
    "pypdf>=6.0,<7",
    "python-docx>=1.1,<2",
    "sqlite-vec>=0.1,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "reportlab>=4,<5",
]


[project.urls]
Homepage = "https://github.com/fcamasca/barbarion"
Repository = "https://github.com/fcamasca/barbarion"
Issues = "https://github.com/fcamasca/barbarion/issues"

[project.scripts]
barbarion = "barbarion.cli:main"

[tool.setuptools.dynamic]
version = { attr = "barbarion.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"barbarion.resources" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
