domain = "default"
data_dir = "./data"
output_dir = "./output"
logs_dir = "./logs"
database_path = "./data/barbarion.db"
log_level = "INFO"
ollama_url = "http://127.0.0.1:11434"
ollama_timeout_seconds = 2.0

[ingestion]
paths = ["./sources"]
extensions = [
  ".sql", ".pks", ".pkb", ".prc", ".fnc", ".trg",
  ".pck", ".vw", ".vws", ".pkg", ".tps",
  ".srw", ".sru", ".srf", ".srm", ".srj", ".srd", ".pbl",
  ".md", ".txt", ".docx", ".pdf",
  ".yaml", ".yml", ".json", ".ini"
]
chunk_size = 4000
chunk_overlap = 400
ignore_patterns = [
  ".git/**", ".barbarion/**", ".venv/**",
  "**/__pycache__/**", "data/**", "output/**", "logs/**",
  "**/node_modules/**"
]
max_file_size_mb = 50
max_extracted_chars = 5000000
max_pdf_pages = 1000
encodings = ["utf-8", "cp1252", "latin-1"]

[embeddings]
provider = "ollama"
model = "nomic-embed-text"
batch_size = 16
timeout_seconds = 60.0
normalize = true

[vector_store]
provider = "sqlite_vec"
table_prefix = "rag"
distance = "cosine"

[retrieval]
mode = "hybrid"
top_k = 10
candidate_k = 40
similarity_threshold = 0.20
vector_weight = 0.70
keyword_weight = 0.30

[rag]
context_token_budget = 6000
max_chunk_tokens = 1200
dedupe_min_hash_prefix = 16
include_snippets = true

[llm]
provider = "ollama"
model = "llama3.1:8b"
timeout_seconds = 600.0
temperature = 0.1
